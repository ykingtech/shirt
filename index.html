<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Cricket App - License Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    h2 { color: #38bdf8; text-align: center; }
    .container { max-width: 1000px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background-color: #0f172a; color: #94a3b8; font-weight: 600; }
    
    .badge-active { background: #16a34a; color: white; padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    .badge-blocked { background: #dc2626; color: white; padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    
    .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-add { background: #10b981; color: white; font-size: 15px; }
    .btn-add:hover { background: #059669; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-edit:hover { background: #2563eb; }
    
    /* Modal Styles */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 50; backdrop-filter: blur(2px); }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 25px; border-radius: 10px; z-index: 100; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 5px; background: #0f172a; color: white; box-sizing: border-box; font-family: inherit; }
    .form-group input:read-only { background: #1e293b; color: #94a3b8; cursor: not-allowed; }
    
    .btn-save { background: #10b981; color: white; width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; }
    .btn-save:hover { background: #059669; }
    .btn-cancel { background: #64748b; color: white; width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; }
    .btn-cancel:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🏏 Pro Cricket App - License Dashboard</h2>
    
    <div class="header-actions">
      <p style="color: #94a3b8; margin: 0;">Manage your customer rentals and software access.</p>
      <button class="btn btn-add" onclick="openAddModal()">+ Add New License</button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Device ID</th>
          <th>Customer Name</th>
          <th>Status</th>
          <th>Expire Date & Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="licenseTableBody">
        <tr><td colspan="5" style="text-align:center; padding: 20px;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="modal" id="editModal">
    <h3 id="modalTitle">Edit License</h3>
    
    <div class="form-group">
      <label>Device ID:</label>
      <input type="text" id="editDeviceId" placeholder="Enter Device ID">
    </div>
    
    <div class="form-group">
      <label>Customer Name:</label>
      <input type="text" id="editName" placeholder="e.g. Kamal Club">
    </div>
    
    <div class="form-group">
      <label>Access Status:</label>
      <select id="editStatus">
        <option value="true">Active (Allow Access)</option>
        <option value="false">Blocked (Deny Access)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Expiration Date & Time:</label>
      <input type="datetime-local" id="editExpire">
    </div>
    
    <div class="form-group">
      <label>Screen Message (If Blocked/Expired):</label>
      <textarea id="editMessage" rows="3" placeholder="Please contact admin to renew."></textarea>
    </div>
    
    <button class="btn btn-save" id="saveBtn">Save License</button>
    <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
  </div>

  <script type="module">
    // Firebase Imports (setDoc එක අලුතින් එකතු කරලා තියෙන්නෙ)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCbl8DRKq5cgye8JxWPUNwFewAPZfwRSiY",
      authDomain: "cricket-7175c.firebaseapp.com",
      projectId: "cricket-7175c",
      storageBucket: "cricket-7175c.firebasestorage.app",
      messagingSenderId: "870290283670",
      appId: "1:870290283670:web:c57cf94d52aeb7fdb576b7",
      measurementId: "G-TP4NTJ7Z4Z"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global variables
    let licensesData = {};
    let isEditMode = false; // අලුතින් දානවද, තියෙන එකක් edit කරනවද කියල බලන්න

    // Fetch data in real-time
    const licensesCol = collection(db, "licenses");
    onSnapshot(licensesCol, (snapshot) => {
      const tbody = document.getElementById("licenseTableBody");
      tbody.innerHTML = ""; 

      if (snapshot.empty) {
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px; color:#94a3b8;'>No licenses found. Add a new one!</td></tr>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const id = docSnap.id;
        const data = docSnap.data();
        licensesData[id] = data;

        const isActive = data.isActive;
        const statusBadge = isActive 
          ? `<span class="badge-active">Active</span>` 
          : `<span class="badge-blocked">Blocked</span>`;

        let dateStr = "N/A";
        if(data.expireAt) {
          const dateObj = new Date(data.expireAt);
          dateStr = dateObj.toLocaleString(); 
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="font-family: monospace; color: #38bdf8; font-size: 13px;">${id}</td>
          <td style="font-weight: bold;">${data.customerName || 'New User'}</td>
          <td>${statusBadge}</td>
          <td style="font-size: 14px; color: #cbd5e1;">${dateStr}</td>
          <td><button class="btn btn-edit" onclick="openEditModal('${id}')">Edit</button></td>
        `;
        tbody.appendChild(tr);
      });
    });

    // --- Modal Logic --- //
    
    // 1. Add New License Modal එක ඕපන් කිරීම
    window.openAddModal = function() {
      isEditMode = false;
      document.getElementById("modalTitle").innerText = "Add New License";
      
      // Form එක හිස් කිරීම
      document.getElementById("editDeviceId").value = "";
      document.getElementById("editDeviceId").readOnly = false; // ID එක Type කරන්න දෙනවා
      document.getElementById("editName").value = "";
      document.getElementById("editStatus").value = "true";
      document.getElementById("editExpire").value = "";
      document.getElementById("editMessage").value = "ඔබගේ මෘදුකාංගය සක්‍රීය කර නොමැත. කරුණාකර ඇඩ්මින් සම්බන්ධ කරගන්න.";

      document.getElementById("overlay").style.display = "block";
      document.getElementById("editModal").style.display = "block";
    }

    // 2. තියෙන License එකක් Edit කරන්න ඕපන් කිරීම
    window.openEditModal = function(id) {
      isEditMode = true;
      document.getElementById("modalTitle").innerText = "Edit License";
      
      const data = licensesData[id];
      if(!data) return;

      document.getElementById("editDeviceId").value = id;
      document.getElementById("editDeviceId").readOnly = true; // Edit කරද්දි ID එක වෙනස් කරන්න බෑ
      document.getElementById("editName").value = data.customerName || "";
      document.getElementById("editStatus").value = data.isActive ? "true" : "false";
      
      if (data.expireAt) {
        const d = new Date(data.expireAt);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        document.getElementById("editExpire").value = d.toISOString().slice(0, 16);
      } else {
        document.getElementById("editExpire").value = "";
      }

      document.getElementById("editMessage").value = data.adminMessage || "";

      document.getElementById("overlay").style.display = "block";
      document.getElementById("editModal").style.display = "block";
    }

    // Modal එක Close කිරීම
    window.closeModal = function() {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("editModal").style.display = "none";
    }

    // Save බොත්තම එබූ විට Database එකට යැවීම
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const id = document.getElementById("editDeviceId").value.trim();
      if (!id) {
        alert("Please enter a Device ID!");
        return;
      }

      const newName = document.getElementById("editName").value || "Unknown Customer";
      const newStatus = document.getElementById("editStatus").value === "true";
      
      const htmlDate = document.getElementById("editExpire").value;
      const newExpire = htmlDate ? new Date(htmlDate).toISOString() : new Date().toISOString();
      
      const newMessage = document.getElementById("editMessage").value;

      try {
        const docRef = doc(db, "licenses", id);
        
        if (isEditMode) {
          // තියෙන එකක් Update කරනවා නම් (updateDoc)
          await updateDoc(docRef, {
            customerName: newName,
            isActive: newStatus,
            expireAt: newExpire,
            adminMessage: newMessage
          });
          alert("License Updated Successfully!");
        } else {
          // අලුතින්ම Add කරනවා නම් (setDoc)
          await setDoc(docRef, {
            customerName: newName,
            isActive: newStatus,
            expireAt: newExpire,
            adminMessage: newMessage
          });
          alert("New License Added Successfully!");
        }
        
        closeModal();
      } catch (error) {
        console.error("Error saving document: ", error);
        alert("Error saving data! Check console for details.");
      }
    });

  </script>
</body>
</html>
